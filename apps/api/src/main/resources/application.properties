spring.application.name=madpix-api

# SQLite on a Fly volume. One connection: SQLite allows one writer at a time, and a
# single connection makes every transaction run in turn, so two artists can't grab
# the same seat.
madpix.db-path=${DB_PATH:./madpix.db}
spring.datasource.url=jdbc:sqlite:${madpix.db-path}?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=1

spring.flyway.locations=classpath:db/migration

# Expo's push service. Set EXPO_ACCESS_TOKEN if push security is turned on in the Expo account.
madpix.push.enabled=${PUSH_ENABLED:true}
madpix.push.access-token=${EXPO_ACCESS_TOKEN:}

# For acting on reports (see admin.sh). Unset means the /admin routes are off.
madpix.admin-token=${ADMIN_TOKEN:}

# Fly's health check.
management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthz

server.port=${PORT:8080}
server.shutdown=graceful
spring.mvc.problemdetails.enabled=true
