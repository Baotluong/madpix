<!doctype html>
<!--
  Google Play feature graphic (1024x500). Render with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1024,500 \
    --screenshot=feature-graphic.png feature-graphic.html
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        background: #5b8de6;
        font-family: -apple-system, 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif;
        color: #fff;
      }
      .text {
        position: absolute;
        left: 64px;
        top: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -2px;
        line-height: 1;
      }
      .sub {
        margin-top: 10px;
        font-size: 40px;
        font-weight: 700;
        color: #1f2430;
      }
      .tag {
        margin-top: 22px;
        font-size: 23px;
        font-weight: 600;
        line-height: 1.45;
        opacity: 0.95;
      }
      /* The elephant from the app icon, cropped to the drawing. The icon's background is the same blue. */
      .art {
        position: absolute;
        left: 448px;
        top: 112px;
        width: 548px;
        height: 268px;
        overflow: hidden;
      }
      .art img {
        width: 648px;
        margin-left: -44.3px;
        margin-top: -189.8px;
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>MadPix</h1>
      <div class="sub">Fold &amp; Draw</div>
      <div class="tag">Draw one strip.<br />See only a sliver.<br />Unfold the mashup.</div>
    </div>
    <div class="art"><img src="../../assets/images/icon.png" alt="" /></div>
  </body>
</html>
